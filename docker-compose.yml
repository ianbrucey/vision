# ============================================================================
# Vision — Development Infrastructure
# ============================================================================
# Single-command local Postgres 15 with pgvector + MinIO for file storage.
#
#   docker compose -f docker-compose.yml up -d
#
# Postgres runs on port 5433 (so it coexists with the main war_room postgres
# on 5432). MinIO runs on port 9002 (so it coexists with a brew-installed
# MinIO on 9000).
# ============================================================================

version: '3.9'

services:
  # ------------------------------------------------------------------
  # PostgreSQL 15 + pgvector
  # ------------------------------------------------------------------
  vision-db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: vision
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: vision_dev
    ports:
      - '5433:5432'
    volumes:
      - vision_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vision']
      interval: 3s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # MinIO — S3-compatible object storage (documents, evidence)
  # ------------------------------------------------------------------
  vision-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9002:9000'   # S3 API  — matches storage.py default
      - '9003:9003'   # Web console
    volumes:
      - vision_minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local']
      interval: 3s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # MinIO bucket auto-creation (runs once after MinIO is healthy)
  # ------------------------------------------------------------------
  vision-minio-init:
    image: minio/mc:latest
    depends_on:
      vision-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://vision-minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/vision-uploads;
      echo 'MinIO bucket ready: vision-uploads';
      exit 0;
      "

volumes:
  vision_pgdata:
  vision_minio_data:
